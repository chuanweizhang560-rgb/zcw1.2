/**:
    ros__parameters:
      # LiDAR topic (from iris_stereo_velodyne)
      lid_topic: "/uav1/velodyne_points"
      # IMU topic (from iris_stereo_velodyne)
      imu_topic: "/uav1/imu"
      # Camera topic (from iris_stereo_velodyne)
      img_topic: "/uav1/stereo_camera/left/image_raw"
      img_en: true

      # LiDAR preprocessing
      preprocess:
        lidar_type: 2  # 2=VELO16 (VLP-16)
        scan_line: 16
        blind: 0.01
        point_filter_num: 3
        feature_enabled: true

      # LIO parameters
      lio:
        max_layer: 1
        voxel_size: 0.5
        min_eigen_value: 0.01
        sigma_num: 3
        beam_err: 0.02
        dept_err: 0.05
        layer_init_num: [5, 5, 5, 5, 5]
        max_points_num: 50
        max_iterations: 5

      # IMU parameters
      imu:
        gyr_cov: 0.001
        acc_cov: 0.001
        inv_expo_cov: 0.001

      # Extrinsic calibration (identity - for simulation, replace with real calibration)
      extrin_calib:
        extrinsic_T: [0, 0, 0]
        extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
        Pcl: [0, 0, 0]
        Rcl: [1, 0, 0, 0, 1, 0, 0, 0, 1]

      # Publish options
      publish:
        blind_rgb_points: 0.01
        pub_effect_point_en: false
        pub_plane_en: false

      # Debug
      debug:
        plot_time: -10
        frame_cnt: 6

      # PCD save
      pcd_save:
        pcd_save_en: false
        filter_size_pcd: 0.5
        colmap_output_en: false

      # Image save
      image_save:
        img_save_en: false
        interval: 1

      # Miscellaneous
      ros_driver_fix_en: false
      hilti_en: false
